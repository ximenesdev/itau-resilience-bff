<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title translate="no">Itaú · Resilience Ops</title>

    <!-- Fontes carregadas via <link> (não mais via @import no CSS).
         PORQUÊ: @import dentro do CSS é "render-blocking serial" — o navegador só
         descobre a fonte DEPOIS de baixar e ler o CSS, atrasando o primeiro desenho
         da tela. Com <preconnect> abrimos a conexão com o servidor de fontes cedo,
         e o <link> deixa o download começar em paralelo com o resto da página. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
